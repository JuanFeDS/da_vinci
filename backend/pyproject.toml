[tool.poetry]
name = "davinci-backend"
version = "1.0.0"
description = "Backend API para DaVinci - Visualizaciones dinámicas"
authors = ["JuanfeDS <jmartinezbernal02@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pandas = "^2.2.0"
openpyxl = "^3.1.2"
python-multipart = "^0.0.9"
pydantic = "^2.6.0"
numpy = "^1.26.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
